# 本地开发验证用的站点配置：跟 deploy/nginx.conf 的区别只有"没有 SSL、没有 80->443 重定向"，
# 其余（/api 反代剥前缀、超时、关缓冲、上传大小、缓存头）都保持一致——本地要验证的正是这些行为，
# 如果这里跟生产不一样，本地测过了也不代表生产没问题。
# 本地不配证书是因为自签证书浏览器会拦、徒增验证摩擦，而 TLS 本身不是这里要验证的东西。

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml;

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 末尾斜杠 = 剥掉 /api 前缀，跟生产配置完全一致，详见 deploy/nginx.conf 里的说明
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_cache off;
    }
}
