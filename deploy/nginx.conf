# 生产站点配置：托管前端静态文件 + 把 /api/ 反代到后端容器。
# 浏览器只跟这一个 origin（https://civics.randomgen.tech）打交道，前后端同源，不需要 CORS。

# gzip：前端是一个 100KB+ 的单文件 HTML，压完通常能到 1/4 左右，首屏收益明显
gzip on;
gzip_vary on;                 # 让缓存/CDN 按 Accept-Encoding 区分，别把压缩版发给不支持的客户端
gzip_min_length 1024;         # 太小的响应压缩收益抵不过 CPU 开销
gzip_comp_level 5;            # 5 是压缩率和 CPU 的常用折中
gzip_types text/plain text/css text/javascript application/javascript application/json
           application/xml image/svg+xml;

# HTTP 全部 301 到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name civics.randomgen.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                 # nginx 1.25.1+ 的写法；老的 `listen 443 ssl http2` 已废弃
    server_name civics.randomgen.tech;

    # 证书由 compose 挂载进来（./certs:/etc/nginx/certs:ro），不打进镜像——
    # 换证书只要替换宿主机文件 + 重启容器，不用重新构建推送镜像
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传 Word/PDF 教学大纲用，nginx 默认只有 1m，超了直接 413 且前端只能看到一个语焉不详的失败
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 必须 no-cache：它是整个前端的入口，里面直接内联了全部 JS。
    # 如果被浏览器/中间层缓存住，发新版本后用户会一直拿到旧代码，还很难让他们手动清缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 带后缀的静态资源可以放心长缓存（当前项目其实只有 index.html 一个文件，
    # 这条是为将来加图片/字体等资源预留的）
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 前端是单页应用：刷新 /cases 这类前端路由时磁盘上并没有对应文件，
    # try_files 兜底回 index.html，交给前端自己处理路由，否则会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 【proxy_pass 末尾这个斜杠是关键】
        # 带斜杠 -> nginx 把 location 匹配掉的那段（/api/）替换成 proxy_pass 里的路径（/），
        #          即剥掉前缀：浏览器请求 /api/cases  ==> 后端收到 /cases
        # 不带斜杠 -> 原样透传：浏览器请求 /api/cases ==> 后端收到 /api/cases
        # 本项目后端的路由都注册成不带 /api 的形式（配合 FastAPI 的 root_path="/api"），
        # 所以这里必须带斜杠。少写这个斜杠会导致全站 404。
        #
        # 【重要运维注意】这里把上游主机名写成字面量（而不是变量），nginx 会在**加载配置时**
        # 就把 api 解析成 IP 并一直缓存。带来两个后果，实测验证过：
        #  1) 启动顺序：api 还没起来时 web 会直接拒绝启动（报 host not found in upstream）。
        #     已用 compose 的 depends_on: condition: service_healthy 保证顺序，不会踩到。
        #  2) 发版换 IP：如果只重建 api 容器、不动 web，api 拿到新 IP 后 nginx 还在用旧 IP，
        #     会**持续 502 直到 web 重启**。所以更新应用时务必让 web 也一起重建，
        #     部署命令见 .github/workflows/deploy.yml 里的说明（用 --force-recreate 带上 web）。
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 案例生成/知识点匹配这些要调大模型，虽然已经改成后台任务了，但轮询接口和上传解析
        # 仍可能偏慢；900s 给足余量，避免 nginx 先于后端把连接掐断
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # 【必须关缓冲】AI 助手对话是 SSE 流式返回（后端 /chat 返回 StreamingResponse）。
        # nginx 默认会把上游响应攒够一批再发给客户端，那样打字机效果就没了——用户要等整段
        # 回复生成完才一次性看到。关掉缓冲才能逐字推给浏览器。
        proxy_buffering off;
        proxy_cache off;
    }
}
